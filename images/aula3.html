<code>
    <fieldset>

        <label for="idade">Idade: </label> <!--Escolher idade-->
            <input type="number" id="idade" name="idade" min="1" max="150">

        <br>
        <br>

        <label for="color">Escolha uma cor: </label> <!--Escolher cor-->
            <input type="color" name="color" id="color">

        <br>
        <br>

        <label for="arquivo">Carregar arquivo: </label> <!--Carregar arquivo -->
            <input type="file" name="file" id="file">
        
        <br>
        <br>

        <label for="pais">País: </label> <!--Menu DropDown -->
            <select name="pais" id="pais">
                <option value="Brasil">Brasil</option>
                <option value="Alemanha">Alemanha</option>
                <option value="Franca">França</option>
            </select>

        <br>
        <br>

        <label for="mensagem">Mensagem: </label> <!--Caixa de texto -->
        <br>
            <textarea 
            name="mensagem" 
            id="mensagem"
            rows="5"
            cols="40"
            placeholder="Digite sua mensagem...">
            </textarea>

        <br>

    </fieldset>
</code>
